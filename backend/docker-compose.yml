version: "3.9"

services:
  web:
    build: .
    command: gunicorn core.wsgi:application -c gunicorn.conf.py
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://reelsdraft:reelsdraft@db:5432/reelsdraft
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://reelsdraft:reelsdraft@db:5432/reelsdraft
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A core beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgres://reelsdraft:reelsdraft@db:5432/reelsdraft
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reelsdraft
      POSTGRES_USER: reelsdraft
      POSTGRES_PASSWORD: reelsdraft
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
